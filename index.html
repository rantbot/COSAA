<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Oyo Staff &amp; Alumni Association</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #F2F5F2; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  This page shows the Camp Oyo members app (a Google Apps Script web app)
  on the association's own domain. It holds no member data.
  If the app ever moves, change APP_URL below and publish again.
-->
<iframe id="app" title="Camp Oyo Staff &amp; Alumni Association" allow="clipboard-write"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwIzb07rS8xz1rx29wkI-1YdsrKSg9V0TLkCiN3b-vvUy39mXpL_A9KbIYl5A_ct9k/exec';
  // Pass the address's settings (sign-in link, filters) along to the app.
  document.getElementById('app').src = APP_URL + window.location.search;
  // Remove the one-time sign-in code from the address bar, keep any filters.
  var params = new URLSearchParams(window.location.search);
  if (params.has('t')) {
    params.delete('t');
    var rest = params.toString();
    history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : ''));
  }
  // The app reports its current filters so this address can be bookmarked or shared.
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    var d = e.data;
    if (!d || d.type !== 'oyo-filters' || typeof d.qs !== 'string') return;
    history.replaceState(null, '', window.location.pathname + (d.qs ? '?' + d.qs : ''));
  });
</script>
</body>
</html>
