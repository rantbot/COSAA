<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Oyo Staff &amp; Alumni Association</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #F2F5F2; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  This page shows the Camp Oyo members app (a Google Apps Script web app)
  on the association's own domain. It holds no member data.
  If the app ever moves, change APP_URL below and publish again.
-->
<iframe id="app" title="Camp Oyo Staff &amp; Alumni Association" allow="clipboard-write"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwPi3OhZulCH2C6UqYvQQ2z_I4hi3ipLCZkfAfOSjmfSENRKFPMJGIbap_QfI26Uxn3/exec';
  // Pass along the sign-in link (?t=...) so emailed links work on this domain.
  document.getElementById('app').src = APP_URL + window.location.search;
  // Remove the one-time link from the address bar after it's used.
  if (window.location.search) history.replaceState(null, '', window.location.pathname);
</script>
</body>
</html>
